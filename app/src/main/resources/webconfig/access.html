<!doctype html>
<html lang="%LANG%">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0d1117">
  <meta name="portal-invalid-code" content="%INVALID_CODE%">
  <title>Configuration à distance</title>
  <link rel="stylesheet" href="webconfig.css">
</head>
<body class="access-body">
  <label class="access-language"><span class="sr-only">Choisir la langue</span><select id="language-select"><option value="fr">FR</option><option value="en">EN</option></select></label>
  <main class="access-main">
    <section aria-labelledby="page-title">
      <header class="page-header"><div><p>Portal</p><h1 id="page-title">Configuration à distance</h1></div></header>
      <p class="access-instruction">Saisissez le code affiché sur le panneau.</p>
      <form id="access-form" action="/" method="get" novalidate>
        <label class="access-label" for="token">Code d’accès</label>
        <input id="token" name="t" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" maxlength="9" required autofocus placeholder="XXXX-XXXX" aria-describedby="access-help">
        <p id="access-help" class="access-help">8 caractères, sans espaces.</p>
        <p id="access-error" class="notice error hidden" role="alert">Code incorrect. Consultez le panneau pour le vérifier.</p>
        <button type="submit" class="button primary access-submit">Continuer</button>
      </form>
      <p class="inline-note">Le téléphone et le panneau doivent utiliser le même réseau Wi-Fi.</p>
    </section>
  </main>
  <script src="access.js?lang=%LANG%"></script>
</body>
</html>
