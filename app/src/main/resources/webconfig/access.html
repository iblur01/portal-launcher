<!doctype html>
<html lang="fr" class="h-full bg-black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#000000">
  <meta name="portal-invalid-code" content="%INVALID_CODE%">
  <title>Configuration à distance</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="webconfig.css">
</head>
<body class="min-h-full bg-black text-white antialiased">
  <main class="mx-auto flex min-h-screen w-full max-w-lg items-center px-5 py-10 sm:px-8">
    <section class="w-full" aria-labelledby="page-title">
      <header class="mb-8">
        <div class="mb-6 grid size-12 place-items-center rounded-[14px] bg-[#1c1c1e] shadow-surface" aria-hidden="true">
          <svg class="size-6 text-[#0a84ff]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M8 9h8M8 13h5"/></svg>
        </div>
        <h1 id="page-title" class="text-balance text-[2rem] font-semibold leading-tight tracking-[-0.03em]">Configuration à distance</h1>
        <p class="mt-3 max-w-md text-pretty text-[1.05rem] leading-7 text-white/60">Saisissez le code affiché sur le panneau.</p>
      </header>
      <form id="access-form" action="/" method="get" novalidate>
        <div id="access-error" class="mb-4 hidden rounded-xl bg-[#3a1717] px-4 py-3 text-sm font-medium text-[#ffb4ae]" role="alert">Code incorrect. Consultez le panneau pour le vérifier.</div>
        <label for="token" class="mb-2 block text-sm font-medium text-white/70">Code d’accès</label>
        <input id="token" name="t" type="text" inputmode="text" autocomplete="one-time-code" autocapitalize="characters" maxlength="9" required autofocus placeholder="XXXX-XXXX" class="h-16 w-full rounded-xl border border-white/20 bg-[#1c1c1e] px-4 text-center font-mono text-2xl font-semibold uppercase tracking-[0.16em] text-white outline-none placeholder:text-white/30 focus:border-white/70">
        <button type="submit" class="mt-4 flex h-14 w-full items-center justify-center rounded-xl bg-[#0a84ff] px-5 text-base font-semibold text-white outline-none transition-[background-color,transform] duration-150 ease-out hover:bg-[#2997ff] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-white active:scale-[0.96]">Continuer</button>
      </form>
      <p class="mt-6 flex items-start gap-2 text-pretty text-sm leading-6 text-white/45">
        <svg class="mt-1 size-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M5 12.55a11 11 0 0 1 14.08 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01"/></svg>
        Le téléphone et le panneau doivent utiliser le même réseau Wi-Fi.
      </p>
    </section>
  </main>
  <script src="access.js"></script>
</body>
</html>
